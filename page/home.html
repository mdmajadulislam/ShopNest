<!DOCTYPE html>
<html lang="en">
<head>

<body>

        </div>

        <!----------------------- searchbox -------------*/-->

        <div class="menu-group">
          <button><a href="">Home</a></button>

        </div>
      </div>
    </div>
    
    <!--========================== Products ===================================-->
    <main class="main">
      <div class="search-section" id="searchSection">
        
      </div>
      <div class="products-section" id="productsSection">
            
      </div>
