<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/productsCard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="shortcut icon" href="/assets/icons/shopNesticons2.svg" type="image/svg">
    <title>ShopNest</title>
</head>
<body>
    <header class="header">
        <!---------------- logo box --------------------------->
        <div class="logo-box">
            <a href="./home.html"><img src="../assets/icons/shopNestlogo.png" alt="website-logo"></a>
        </div>

        <!----------------- search box -------------------------->
        <div class="search-box">
            <button id="searchIconBtn" type="button"></button>
            <button id="removeIconBtn" type="button"><i class="fa-solid fa-chevron-left"></i></button>
            
            <!------------- input box -------------------------->
            <div class="input-box">
                <input type="search" id="searchInput" placeholder="search products...">
                <button id="searchBtn">search</button>
            </div>
        </div>

        <!-------------------- menu box ---------------------------------->
        <div class="menu-box">
            <button id="menuBtn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>


    <!--========================== Products ===================================-->
    <main class="main">
        <div class="products-section" id="productsSection">
            
        </div>
    </main>
    <script src="../js/productsComponet.js"></script>
    <script type="module" src="../js/productsComponet.js"></script>
</body>
</html>
